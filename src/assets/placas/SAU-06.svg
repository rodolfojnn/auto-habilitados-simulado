  <!-- Linha de borda interna branca -->
  <rect x="4" y="4" width="92" height="167" rx="8" ry="8" fill="none" stroke="white" stroke-width="1.2" />
  
  <!-- Bloco branco superior para o ícone -->
  <rect x="10" y="10" width="80" height="80" rx="6" ry="6" fill="white" />
  
  <!-- Ícone do telefone (preto) -->
  <path d="M35 25 C 30 25, 25 30, 25 35 L 28 45 C 29 48, 32 50, 35 48 L 42 45 L 55 58 L 52 65 C 50 68, 52 71, 55 72 L 65 75 C 70 75, 75 70, 75 65 C 75 55, 45 25, 35 25 Z" 
        fill="black" transform="rotate(-10, 50, 50)" />
  
  <!-- Seta branca indicativa (inferior) -->
